<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BGFree IRC Network (1998-2005) - Дигитален Музей</title>
    <style>
        :root {
            --terminal-bg: #050505;
            --terminal-green: #33ff33;
            --accent-color: #00ffaa;
            --text-color: #cccccc;
            --success-color: #00ff66;
            --alert-color: #ff3333;
            --warning-color: #ffcc00;
        }
        body {
            background-color: var(--terminal-bg);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            line-height: 1.4;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
        }
        h1, h2, h3 {
            color: #ffffff;
            border-bottom: 1px solid #113311;
            padding-bottom: 5px;
        }
        .subtitle { color: var(--accent-color); font-weight: bold; margin-top: 0; margin-bottom: 30px; font-size: 1.1rem; }
        .terminal {
            background-color: var(--terminal-bg);
            border: 1px solid #333333;
            border-radius: 4px;
            padding: 20px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 40px;
        }
        .output {
            white-space: pre-wrap;
            margin-bottom: 15px;
            color: var(--text-color);
        }
        .input-line {
            display: flex;
            align-items: center;
        }
        .prompt {
            color: var(--terminal-green);
            margin-right: 10px;
            user-select: none;
        }
        input {
            background: transparent;
            border: none;
            color: var(--terminal-green);
            font-family: inherit;
            font-size: inherit;
            flex: 1;
            outline: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🌐 BGFree IRC Network</h1>
    <p class="subtitle">Летопис на Дигиталното Наследство & Софтуерни Мемоари (1998–2005)</p>

    <div class="terminal">
        <div class="output" id="output">💻 BGFree Core Kernel Simulator (v1.9.1-p9) Status: ONLINE
maiz@bgfree-hub:~$ Въведете "help" за списък с команди.</div>
        <div class="input-line">
            <span class="prompt">maiz@bgfree-hub:~$</span>
            <input type="text" id="input" autofocus autocomplete="off" spellcheck="false">
        </div>
    </div>
</div>

<script>
    const output = document.getElementById('output');
    const input = document.getElementById('input');

    const helpText = `\nДостъпни команди:\n  help      - Показва това съобщение за помощ\n  status    - Справка за текущия мрежов статус\n  credits   - Архитекти на софтуерната задруга\n  clear     - Изчиства екрана на терминала\n`;

    const statusText = `\nМрежови статус: ONLINE (Архив)\nБаза: hybserv-1.9.1+BGFree-p9 & ircd-ratbox+bgfree-p4\nКапацитет: 5000+ реални потребители онлайн едновременно\nЪптайм на хъба: 192 Дни, 14 часа без рестарт\nБекбон: CISCO ONS 2.5 Gbps през Telia + TS3-optics: 120ms\n`;

    const creditsHTML = `\n*** BGFree Core Software Fellowship ***\n- maiz (Ангел Нешев) - Net Keeper & Head Developer (Hub & Security)\n- Sofit (Юлиан от Русе) - Senior Services Developer (Hybserv)\n- Decho (Неделчо Станев) - Инфраструктура & SocksCleaner\n- Специална благодарност към demond и kre (Dinko Keric) за насоките.\n<br><a href="history.html" style="color: #33ff33; text-decoration: none; border: 1px solid #33ff33; padding: 6px 15px; display: inline-block; font-weight: bold; background: #000; margin-top: 15px; box-shadow: 0 0 10px rgba(51, 255, 51, 0.3);">📜 ПРЕГЛЕДАЙ: ЛЕТОПИС НА МРЕЖАТА</a>\n`;

    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            const val = input.value.trim().toLowerCase();
            input.value = '';
            
            if (!val) return;
            
            const userLine = document.createElement('div');
            userLine.innerHTML = '<span style="color: #33ff33;">maiz@bgfree-hub:~$</span> ' + val;
            output.appendChild(userLine);

            const res = document.createElement('div');
            res.style.margin = "10px 0 20px 0";

            if (val === 'help') {
                res.innerText = helpText;
            } else if (val === 'status') {
                res.innerText = statusText;
            } else if (val === 'credits') {
                res.innerHTML = creditsHTML;
            } else if (val === 'clear') {
                output.innerHTML = '💻 BGFree Core Kernel Simulator (v1.9.1-p9) Status: ONLINE\nmaiz@bgfree-hub:~$';
                return;
            } else {
                res.innerText = 'Unknown command: "' + val + '". Type "help" for options.';
                res.style.color = "var(--alert-color)";
            }

            output.appendChild(res);
            output.scrollTop = output.scrollHeight;
        }
    });

    window.onclick = function() {
        input.focus();
    };
</script>

</body>
</html>
